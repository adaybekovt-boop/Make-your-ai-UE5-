name: UE5 full integration - source tests, NOT engine verification
on:
  push:
    branches: [agent/full-integration-ue5, agent/full-integration-local-ue5]
    paths: ['Unreal/**', 'src/**', 'package*.json', 'tsconfig*.json', '.github/workflows/ue5-full-integration.yml']
  pull_request:
    branches: [agent/full-integration-ue5]
env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Exact sparse checkout - no authored binaries modified
        shell: bash
        run: |
          set -euo pipefail
          git init source
          cd source
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=64 --filter=blob:none origin "${SOURCE_SHA}:refs/remotes/origin/source-under-test" 'refs/heads/main:refs/remotes/origin/main'
          git sparse-checkout init --no-cone
          printf '/*\n!/Unreal/Assets/\n!/Unreal/CityV4/\n!/public/\n!/artifacts/\n!/Unreal/Evidence/\n!/Unreal/MakeYourAI/Content/\n/Unreal/Assets/*.md\n/Unreal/Evidence/campaign/source-hashes.json\n/Unreal/Evidence/full-integration/\n' | git sparse-checkout set --no-cone --stdin
          git checkout -b source-verification refs/remotes/origin/source-under-test
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p ../test-evidence
          git rev-parse HEAD > ../test-evidence/SOURCE_COMMIT.txt
          git status --porcelain=v1 > ../test-evidence/SOURCE_STATUS.txt
          git merge-base HEAD refs/remotes/origin/main > ../test-evidence/SOURCE_MERGE_BASE.txt
          git ls-tree -r HEAD > ../test-evidence/TRACKED_INVENTORY.txt
          git ls-files '*AGENTS.md' > ../test-evidence/INSTRUCTION_PATHS.txt
          git diff --name-status refs/remotes/origin/main...HEAD > ../test-evidence/SOURCE_CHANGED_FILES.txt
      - name: Locked test dependencies
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts 2>&1 | tee ../test-evidence/npm-ci.log
          pin=$(python3 -c 'import json; print(json.load(open("Unreal/Dependencies/quickjs.lock.json"))["commit"])')
          git init Unreal/ThirdParty/QuickJS/source
          git -C Unreal/ThirdParty/QuickJS/source remote add origin https://github.com/quickjs-ng/quickjs.git
          git -C Unreal/ThirdParty/QuickJS/source fetch --depth=1 origin "$pin"
          git -C Unreal/ThirdParty/QuickJS/source checkout --detach FETCH_HEAD
          test "$(git -C Unreal/ThirdParty/QuickJS/source rev-parse HEAD)" = "$pin"
          cmake -S Unreal/ThirdParty/QuickJS/source -B Unreal/ThirdParty/QuickJS/build/Linux -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON 2>&1 | tee ../test-evidence/quickjs-configure.log
          cmake --build Unreal/ThirdParty/QuickJS/build/Linux --target qjs -j2 2>&1 | tee ../test-evidence/quickjs-build.log
      - name: Independent test suites with honest status collection
        working-directory: source
        shell: bash
        run: |
          export MAI_QUICKJS_SOURCE="$PWD/Unreal/ThirdParty/QuickJS/source"
          export MAI_QUICKJS_LIBRARY="$PWD/Unreal/ThirdParty/QuickJS/build/Linux/libqjs.a"
          python3 Unreal/Tools/verify_source.py --output ../test-evidence/source-suites
      - name: Export reusable local test dependencies and exact source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -d source/node_modules && test -f source/Unreal/ThirdParty/QuickJS/build/Linux/libqjs.a; then
            tar -C source -czf ue5-test-dependencies.tar.gz node_modules Unreal/ThirdParty/QuickJS/source Unreal/ThirdParty/QuickJS/build/Linux/libqjs.a
          fi
          python3 - <<'PY'
          import pathlib, zipfile
          root = pathlib.Path('source').resolve()
          with zipfile.ZipFile('ue5-source-checkout.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.rglob('*')):
                  relative = p.relative_to(root)
                  if p.is_file() and not p.is_symlink() and not any(part in relative.parts for part in ('node_modules', 'ThirdParty', '.out', 'dist', '__pycache__')):
                      z.write(p, 'source/' + relative.as_posix())
          PY
      - name: Retain source evidence, not a compiled game
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ue5-full-integration-source
          path: |
            ue5-source-checkout.zip
            ue5-test-dependencies.tar.gz
            test-evidence/
          retention-days: 3
          if-no-files-found: error
