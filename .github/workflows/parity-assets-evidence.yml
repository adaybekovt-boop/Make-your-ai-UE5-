name: CityV4 source export and native rules dependencies - not UE rendering
on:
  push:
    branches: [agent/browser-parity-cityv4-20260908]
    paths: ['.github/workflows/parity-assets-evidence.yml', 'Unreal/Tools/export_cityv4_instances.py', 'Unreal/Tools/cityv4_format.py']
permissions:
  contents: read
jobs:
  source-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Read exact source without unrelated authoring binaries
        shell: bash
        run: |
          set -euo pipefail
          git init source
          cd source
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git sparse-checkout init --no-cone
          printf '/Unreal/Tools/\n/Unreal/CityV4/city-v4.blend\n/Unreal/CityV4/city-v4.fbx\n' | git sparse-checkout set --no-cone --stdin
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned Blender Python runtime
        run: python -m pip install bpy==4.5.3
      - name: Export actual linked geometry without touching authored source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          sha256sum source/Unreal/CityV4/city-v4.* > evidence/source-before.sha256
          python source/Unreal/Tools/export_cityv4_instances.py --source source/Unreal/CityV4/city-v4.blend --out derived/CityV4 2>&1 | tee evidence/city-export.log
          python source/Unreal/Tools/export_cityv4_instances.py --source source/Unreal/CityV4/city-v4.blend --out derived/CityV4 2>&1 | tee evidence/city-rerun.log
          sha256sum source/Unreal/CityV4/city-v4.* > evidence/source-after.sha256
          diff -u evidence/source-before.sha256 evidence/source-after.sha256
          tar -czf evidence/city-derived.tar.gz -C derived CityV4
          cp derived/CityV4/manifest.json evidence/city-manifest.json
      - name: Fetch the pinned embeddable rules VM source, no browser runtime
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git init quickjs
          cd quickjs
          git remote add origin https://github.com/quickjs-ng/quickjs.git
          git fetch --depth=1 origin 1ab8676f4b6d6d669baeb5f21790fb9734636a20
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = 1ab8676f4b6d6d669baeb5f21790fb9734636a20
          git archive --format=tar.gz -o ../evidence/quickjs-source.tar.gz HEAD
          git rev-parse HEAD > ../evidence/quickjs-source.commit
      - name: Retain measured source evidence; no Unreal PASS claims
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: city-source-evidence
          path: evidence/
          retention-days: 3
